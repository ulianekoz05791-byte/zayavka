<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заявка бара</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#2F6F66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEEC;--surface:#FFFFFF;--ink:#17302C;--muted:#5E706C;--line:#D3DCD9;
  --week:#2F6F66;--wkd:#A96A12;--alert:#B8412E;--alert-bg:#F8E4DF;--ok:#3E7D5B;--soft:#F3F6F5;
  --acc:var(--week);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A18;--surface:#182624;--ink:#E4ECE9;--muted:#93A6A1;--line:#2A3B38;
    --week:#5BB3A6;--wkd:#E0A548;--alert:#EE7A63;--alert-bg:#3A1F1A;--ok:#6FC08F;--soft:#1D2E2B;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A18;--surface:#182624;--ink:#E4ECE9;--muted:#93A6A1;--line:#2A3B38;
  --week:#5BB3A6;--wkd:#E0A548;--alert:#EE7A63;--alert-bg:#3A1F1A;--ok:#6FC08F;--soft:#1D2E2B;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body[data-mode="e"]{--acc:var(--wkd)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.date{color:var(--muted);font-size:14px}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.mode button{border:0;border-radius:10px;padding:11px 8px;background:transparent;font-weight:700;font-size:17px;color:var(--muted)}
.mode button[aria-pressed="true"][data-m="w"]{background:var(--week);color:#fff}
.mode button[aria-pressed="true"][data-m="e"]{background:var(--wkd);color:#fff}

.tools{display:flex;gap:8px;margin-top:10px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:#fff}
.progress{font-size:14px;color:var(--muted);margin:10px 2px 0}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}

.cat{margin-top:14px}
.cathead{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:8px 2px;font-weight:700;font-size:15px;color:var(--muted);text-align:left}
.cathead .n{font-weight:500;font-size:13px}
.cathead .n b{color:var(--alert)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);border-left:4px solid transparent}
.row:first-child{border-top:0}
.row.need{border-left-color:var(--alert)}
.row .nm{font-weight:500;line-height:1.25}
.row .meta{font-size:13px;color:var(--muted);margin-top:2px}
.row .meta .add{color:var(--alert);font-weight:700}
.row .meta .nop{color:var(--muted);font-style:italic}
.inbox{display:flex;align-items:center;gap:6px}
.stock{width:84px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--soft);font-size:17px;font-variant-numeric:tabular-nums}
.stock:focus{background:var(--surface);border-color:var(--acc)}
.unit{width:22px;font-size:14px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--alert)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.panel h2{font-size:17px;margin:0 0 8px}
.panel p{margin:6px 0;color:var(--muted);font-size:14px}
.coefs{display:flex;gap:6px;flex-wrap:wrap}
.note{background:var(--alert-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.note button{background:none;border:0;padding:0;color:var(--alert);font-weight:700;text-decoration:underline}
textarea.out{width:100%;min-height:280px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);font-size:15px;line-height:1.5;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

.irow{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .nm{background:none;border:0;padding:0;text-align:left;font-weight:500;line-height:1.25}
.irow .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.irow input{width:100%;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--soft);font-variant-numeric:tabular-nums}
.ihead{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;font-size:12px;color:var(--muted);padding:0 12px 4px;text-align:right}
.ihead span:first-child{text-align:left}
.cathead .edit{font-size:13px;font-weight:500;color:var(--acc);border:0;background:none;padding:4px 0}

.sug{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sug:first-of-type{border-top:0}
.sug .t{font-size:14px}
.hist{border-top:1px solid var(--line);padding:10px 0}
.hist summary{cursor:pointer;font-weight:500}
.hist pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--soft);padding:10px;border-radius:10px;margin:8px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:11px 4px 13px;font-size:14px;font-weight:500;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--acc);font-weight:700}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:12px;margin-left:4px}

dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,18,.5)}
.dlg{padding:18px}
.dlg h2{margin:0 0 12px;font-size:19px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body data-mode="w">
<div class="wrap">
  <header class="top">
    <div class="titlerow"><h1 id="ttl">Пересчёт</h1><span class="date" id="today"></span></div>
    <div class="mode" role="group" aria-label="Период заявки">
      <button data-m="w" aria-pressed="true">Будни</button>
      <button data-m="e" aria-pressed="false">Выходные</button>
    </div>
    <div id="subhead"></div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs"><div class="in">
  <button data-tab="count" aria-current="page">Пересчёт</button>
  <button data-tab="order">Заявка</button>
  <button data-tab="items">Позиции</button>
  <button data-tab="more">Ещё<span id="sugBadge"></span></button>
</div></nav>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SEED = [["Вермуты",[["Вермут МАРТИНИ БЬЯНКО","л"],["Вермут МАРТИНИ РОССО","л"],["Вермут МАРТИНИ ФИЕРО","л"]]],["Вино белое",[["Вино АЛАЗАНСКАЯ ДОЛИНА белое","л"],["Вино Пиногриджио","л"],["Вино Альма дель торо белое сухое","л"],["Вино Альма дель торо полусладкое белое","л"],["Вино БОНАВИТА белое п/сух","л"]]],["Вино игристое",[["Вино игристое Шато Тамань брют","шт"],["Вино игристое Шато Тамань п/сладкое","шт"]]],["Вино красное",[["Вино Алазанская долина кросное полусладкое","л"],["Вино Альма дель торо красное полусладкое","л"],["Вино БОНАВИТА красное п/сух","л"]]],["Виски",[["Виски ВИЛЬЯМ ЛОУСОНС","л"],["Виски ДЖИМ БИМ","л"],["Виски ВИЛЬЯМ ЛОУСОНС СУПЕР СПАЙСД","л"],["Виски ДЖИМ БИМ Ред Стаг","л"],["Виски Хайланд парк 12 лет","л"]]],["Водка",[["Водка Архангельская","л"]]],["Джин",[["Джин Хаус","л"],["Джин Баристер","л"],["Джин Баристер тропические фрукты","л"]]],["Текила",[["Текила ОЛЬМЕКА БЛАНКО","л"],["Текила ОЛЬМЕКА ЗОЛОТАЯ","л"],["Текила(хаус)","л"]]],["Коньяк",[["Коньяк АРАРАТ 3 лет","л"],["Коньяк АРАРАТ 5 лет","л"]]],["Ликёры",[["Биттер Апероль","л"],["Ликер Бехеровка","л"],["Ликер десертный Биттер Лигаре","л"],["Ликер Минтту груша и мята","л"],["Ликер Минтту перечная мята","л"],["Ликер нива Трипл Сек","л"],["Ликер Самбука нива","л"],["Ликер нива сливочный","л"],["Ликер Ягермайстер","л"]]],["Ром",[["Ром Бакарди спайсд","л"],["Ром ОАКХАРТ ОРИДЖИНАЛ","л"],["Ром Хаус","л"]]],["Пиво",[["Велкопоповицкий козел тёмное","шт"],["Крон бланш бьер","шт"],["Пиво КОРОНА ЭКСТРА 0,33","шт"],["Стелла артуа","шт"],["Стелла артуа б/а","шт"],["Шпатен Мюнхен","шт"],["Эль капулько","шт"]]],["Сидр",[["Сидр ЧЕСТЕРС Вишневый 0,45 л.","шт"],["Сидр ЧЕСТЕРС Грушевый 0,45 л.","шт"],["Сидр ЧЕСТЕРС Лесные ягоды 0,45 л.","шт"],["Сидр ЧЕСТЕРС Яблочный П/СУХ. 0,45 л.","шт"],["Сидр ЧЕСТЕРС Яблочный сладкий 0,45 л.","шт"]]],["Мороженное",[["Мороженное пломбир","кг"],["Мороженное шоколадное","кг"],["Мороженное фисташковое","кг"]]],["Специи",[["Бадьян","кг"],["Взбитые сливки","кг"],["Гвоздика","кг"],["Кардамон","кг"],["Корица молотая","кг"],["Корица палочки","кг"],["Мед","кг"],["Молоко","л"],["Мускатный орех","кг"],["Перец черный молотый","кг"],["Сахар","кг"],["Сахар тростниковый","кг"],["Сливки 10%","л"],["Соль","кг"],["Табаско","л"],["Чабрец","кг"]]],["сиропы/топпинги",[["Аскорбиновая кислота","кг"],["Сироп в ассортименте","л"],["Топпинг в ассортименте","кг"]]],["Орехи",[["Арахис","кг"],["Фисташки","кг"],["Кешью","кг"]]],["Торты",[["Медовик","шт"],["Торт Чизкейк Нью-Йорк","шт"],["Чизкейк клубничный","шт"],["Чизкейк шоколадный","шт"]]],["Фрукты/ягоды",[["Апельсин","кг"],["Вишня (заморозка)","кг"],["Гранат","кг"],["Грейпфрут","кг"],["Имбирь корень","кг"],["Клубника замороженная","кг"],["Клюква","кг"],["Лайм","кг"],["Лимон свежий","кг"],["Малина замороженная","кг"],["Мята","кг"],["Мята перечная","кг"],["Облепиха замороженная","кг"],["Брусника","кг"],["Яблоки свежие","кг"]]],["Напитки",[["БОН АКВА 0,5 л. газ","л"],["БОН АКВА 0,5 л. негаз","л"],["Добрый лимон-лайм 0,25 стекло","шт"],["Добрый апельсин 0,25 стекло","шт"],["КОКА-КОЛА Рич 0,33 л. стекло","шт"],["КОКА-КОЛА, л.","л"],["МОРС","л"],["РЕД БУЛЛ","шт"],["Сок RICH Ананас","л"],["Сок RICH Апельсин","л"],["Сок RICH Вишня","л"],["Сок Rich мультифрукт","л"],["Сок RICH Яблоко","л"],["СПРАЙТ, л.","л"],["ШВЕПС, л.","л"],["Энергетический напиток Вольт","шт"]]],["Чай",[["Белое крфло байкала","кг"],["Вишневый коблер","кг"],["Гуава маргарита","кг"],["Губа Алишань","кг"],["Жасминовая жемчужина дракона","кг"],["Иван-чай с малиной","кг"],["Имбирь молотый","кг"],["каркаде","кг"],["Кофе зерно","кг"],["Лаванда","кг"],["Чай Да Хун Пао","кг"],["Чай зеленый классический","кг"],["Чай клюквенный","кг"],["Чай манго-маракуйя","кг"],["Чай медовый улун","кг"],["Чай меч самурая","кг"],["Чай Молочный Улун","кг"],["Чай Нам Док Ачан","кг"],["Чай пуэр дворцовый","кг"],["Чай пуэр спелая клюква","кг"],["Чай Ройбуш","кг"],["Чай с шелковицей","кг"],["Чай сладкая груша","кг"],["Чай смесь для Массала","кг"],["Чай Те Гуань Инь","кг"],["Чай Фруктовый","кг"],["Чай черный классический","кг"],["Чай черный с бергамотом","кг"],["Чай четыре ягоды","кг"]]]];
const KEY = 'bar-orders-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
let S = null;
let tab = 'count';
let q = '';
let filter = 'all';
let collapsed = {};

function initial() {
  const st = { cats: [], items: [], mode: 'w', coef: 1, stocks: {}, history: [], dismissed: {}, withCats: true };
  SEED.forEach(([cn, items]) => {
    const c = { id: uid(), name: cn };
    st.cats.push(c);
    items.forEach(([n, u]) => st.items.push({ id: uid(), name: n, unit: u, cat: c.id, pw: 0, pe: 0, step: 0 }));
  });
  return st;
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch (e) {}
  if (!S || !Array.isArray(S.items)) S = initial();
  S.stocks ||= {}; S.history ||= []; S.dismissed ||= {}; if (S.withCats === undefined) S.withCats = true; S.coef ||= 1;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => String(Math.round(n * 1000) / 1000).replace('.', ',');
function num(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace(',', '.');
  if (s === '') return null;
  const n = parseFloat(s);
  return isNaN(n) || n < 0 ? null : n;
}
const plan = (it, m = S.mode) => (m === 'w' ? it.pw : it.pe) || 0;
const stepOf = it => it.step > 0 ? it.step : (it.unit === 'шт' ? 1 : 0.1);
function roundUp(x, step) { return Math.round(Math.ceil(x / step - 1e-9) * step * 1000) / 1000; }
function qty(it) {
  const p = plan(it) * S.coef, st = S.stocks[it.id];
  if (!(p > 0) || st === undefined || st === null || st >= p) return 0;
  return roundUp(p - st, stepOf(it));
}
const catName = id => (S.cats.find(c => c.id === id) || {}).name || 'Без категории';
const modeWord = (m = S.mode) => m === 'w' ? 'будни' : 'выходные';
const dstr = t => new Date(t).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Скопировано'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); toast(ok ? 'Скопировано' : 'Не удалось скопировать — выделите текст вручную');
}

/* ---------- ПЕРЕСЧЁТ ---------- */
function matches(it) { return !q || it.name.toLowerCase().includes(q.toLowerCase()); }
function rowMeta(it) {
  const p = plan(it);
  if (!(p > 0)) return `<span class="nop">планка не задана</span>`;
  const k = qty(it);
  return `планка ${fmt(p * S.coef)} ${esc(it.unit)}` + (k > 0 ? ` <span class="add">+${fmt(k)} ${esc(it.unit)}</span>` : '');
}
function renderCount() {
  const total = S.items.length, filled = S.items.filter(i => S.stocks[i.id] != null).length;
  document.getElementById('subhead').innerHTML = `
    <div class="tools"><input class="search" id="q" type="search" placeholder="Найти позицию" value="${esc(q)}"></div>
    <div class="filters">
      ${[['all', 'Все'], ['empty', 'Не заполнено'], ['need', 'В заявку']].map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}
    </div>
    <div class="progress" id="prog">Заполнено ${filled} из ${total}</div>
    <div class="bar"><i id="progbar" style="width:${total ? filled / total * 100 : 0}%"></i></div>`;
  let html = '';
  S.cats.forEach(c => {
    let items = S.items.filter(i => i.cat === c.id && matches(i));
    if (filter === 'empty') items = items.filter(i => S.stocks[i.id] == null);
    if (filter === 'need') items = items.filter(i => qty(i) > 0);
    if (!items.length) return;
    const need = S.items.filter(i => i.cat === c.id && qty(i) > 0).length;
    const closed = collapsed[c.id] && !q && filter === 'all';
    html += `<section class="cat">

function updateRow(el, it) {

/* ---------- ЗАЯВКА ---------- */
function orderText() {
  const d = new Date().toLocaleDateString('ru-RU');
  let lines = [`Заявка на ${modeWord()}, ${d}`];
  let any = false;
  if (S.withCats) {
    S.cats.forEach(c => {
      const its = S.items.filter(i => i.cat === c.id && qty(i) > 0);
      if (!its.length) return;
      any = true;
      lines.push('', c.name, ...its.map(i => `${i.name} — ${fmt(qty(i))} ${i.unit}`));
    });
  } else {
    lines.push('');
    S.cats.forEach(c => S.items.filter(i => i.cat === c.id && qty(i) > 0).forEach(i => { any = true; lines.push(`${i.name} — ${fmt(qty(i))} ${i.unit}`); }));
  }
  return any ? lines.join('\n') : '';
}

function insertAtCatEnd(it) {
  let last = -1; S.items.forEach((x, k) => { if (x.cat === it.cat) last = k; });
  if (last < 0) {
    const ci = S.cats.findIndex(c => c.id === it.cat);
    S.items.forEach((x, k) => { if (S.cats.findIndex(c => c.id === x.cat) < ci) last = k; });
  }
  S.items.splice(last + 1, 0, it);
}

/* ---------- ЕЩЁ: подсказки, история, копия ---------- */
function suggestions() {
  const out = [];
  ['w', 'e'].forEach(m => {
    const h = S.history.filter(x => x.mode === m).slice(-3);
    if (h.length < 3) return;
    S.items.forEach(it => {
      const p = plan(it, m); if (!(p > 0)) return;
      const v = h.map(x => x.stocks[it.id]); if (v.some(x => x == null)) return;
      let dir = null, np = p;
      if (v.every(x => x <= 0.15 * p)) { dir = 'up'; np = roundUp(p * 1.25, stepOf(it)); }
      else if (v.every(x => x >= p)) { dir = 'down'; np = Math.max(stepOf(it), roundUp(p * 0.8, stepOf(it))); }
      if (!dir || np === p) return;
      const key = `${it.id}|${m}|${dir}|${h[2].t}`;
      if (S.dismissed[key]) return;
      out.push({ it, m, dir, p, np, key });
    });
  });
  return out;
}

        <div><button class="btn small primary" data-acc="${s.key}">Принять</button> <button class="btn small" data-dis="${s.key}">Оставить</button></div></div>`).join('')
      : `<p>Подсказки появятся после трёх сохранённых заявок на будни или на выходные. Приложение сравнит остатки с планками и предложит поднять или снизить их.</p>`}

/* ---------- общий рендер ---------- */
const titles = { count: 'Пересчёт', order: 'Заявка', items: 'Позиции', more: 'Ещё' };
function render() {
  document.body.dataset.mode = S.mode;
  document.querySelectorAll('.mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === S.mode));
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.getElementById('ttl').textContent = titles[tab];
  ({ count: renderCount, order: renderOrder, items: renderItems, more: renderMore })[tab]();
  badge();

document.querySelector('.mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

});

});
document.addEventListener('change', e => {

document.addEventListener('keydown', e => {

});
document.addEventListener('focusin', e => { if (e.target.classList.contains('stock') || e.target.dataset.p) setTimeout(() => e.target.select(), 0); });

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.f) { filter = t.dataset.f; render(); }
  else if (t.dataset.col) { collapsed[t.dataset.col] = !collapsed[t.dataset.col]; render(); }
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.show) { filter = t.dataset.show; go('count'); }
  else if (t.dataset.coef) { S.coef = +t.dataset.coef; save(); render(); }
  else if (t.dataset.edit) openItem(t.dataset.edit);
  else if (t.dataset.editcat) openCat(t.dataset.editcat);
  else if (t.dataset.acc) {
    const s = suggestions().find(x => x.key === t.dataset.acc);
    if (s) { s.it[s.m === 'w' ? 'pw' : 'pe'] = s.np; S.dismissed[s.key] = 1; save(); render(); toast('Планка обновлена'); }
  }
  else if (t.dataset.dis) { S.dismissed[t.dataset.dis] = 1; save(); render(); }
  else if (t.dataset.copyh) { const h = S.history.find(x => x.t == t.dataset.copyh); if (h) copyText(h.text); }
  else if (t.dataset.delh) { if (confirm('Удалить заявку из истории?')) { S.history = S.history.filter(x => x.t != t.dataset.delh); save(); render(); } }
  else switch (t.id) {
    case 'clear':
      if (confirm('Очистить все остатки и начать новый пересчёт?')) { S.stocks = {}; S.coef = 1; filter = 'all'; save(); render(); toast('Остатки очищены'); }
      break;
    case 'copy': copyText(orderText()); break;
    case 'saveHist': {
      const stocks = {}; S.items.forEach(i => { if (S.stocks[i.id] != null) stocks[i.id] = S.stocks[i.id]; });
      S.history.push({ t: Date.now(), mode: S.mode, coef: S.coef, stocks, text: orderText() });
      S.history = S.history.slice(-60); save(); badge(); toast('Сохранено в историю');
      break;
    }
    case 'addItem': openItem(null); break;
    case 'addCat': openCat(null); break;
    case 'cfgCopy': copyText(JSON.stringify({ kind: 'bar-cfg', t: Date.now(), cats: S.cats, items: S.items })); break;
    case 'cfgLoad': {
      const b = document.getElementById('dlgBody');
      b.innerHTML = `<h2>Загрузить настройки</h2><p class="hint" style="margin:0 0 10px">Вставьте текст настроек, который прислал управляющий. Позиции и планки заменятся, остатки и история останутся.</p>
        <textarea class="out" id="cfg" style="min-height:160px"></textarea>
        <div class="btnrow"><button class="btn primary" id="cfgGo">Загрузить</button><button class="btn" id="cfgNo">Отмена</button></div>`;
      const dlg = document.getElementById('dlg'); dlg.showModal();
      b.querySelector('#cfgNo').onclick = () => dlg.close();
      b.querySelector('#cfgGo').onclick = () => {
        try {
          const d = JSON.parse(b.querySelector('#cfg').value);
          if (d.kind !== 'bar-cfg' || !Array.isArray(d.items) || !Array.isArray(d.cats)) throw 0;
          const byName = {}; S.items.forEach(i => byName[i.name] = i.id);
          const ns = {}; d.items.forEach(i => { const old = S.stocks[i.id] != null ? i.id : byName[i.name]; if (old && S.stocks[old] != null) ns[i.id] = S.stocks[old]; });
          S.cats = d.cats; S.items = d.items; S.stocks = ns; S.cfgDate = d.t || Date.now();
          save(); dlg.close(); render(); toast('Настройки загружены');
        } catch (err) { toast('Это не похоже на настройки из приложения'); }
      };
      break;
    }
    case 'bkCopy': copyText(JSON.stringify(S)); break;
    case 'bkRestore': {
      const b = document.getElementById('dlgBody');
      b.innerHTML = `<h2>Восстановить из копии</h2><p class="hint" style="margin:0 0 10px">Вставьте текст резервной копии. Текущие данные будут заменены.</p>
        <textarea class="out" id="bk" style="min-height:160px"></textarea>
        <div class="btnrow"><button class="btn primary" id="bkGo">Восстановить</button><button class="btn" id="bkNo">Отмена</button></div>`;
      const dlg = document.getElementById('dlg'); dlg.showModal();
      b.querySelector('#bkNo').onclick = () => dlg.close();
      b.querySelector('#bkGo').onclick = () => {
        try { const d = JSON.parse(b.querySelector('#bk').value); if (!Array.isArray(d.items) || !Array.isArray(d.cats)) throw 0; S = d; S.stocks ||= {}; S.history ||= []; S.dismissed ||= {}; S.coef ||= 1; if (S.withCats === undefined) S.withCats = true; save(); dlg.close(); render(); toast('Данные восстановлены'); }
        catch (err) { toast('Это не похоже на резервную копию'); }
      };
      break;
    }
    case 'reset':
      if (confirm('Сбросить всё? Планки, остатки и история будут удалены.')) { S = initial(); save(); render(); toast('Сброшено'); }
      break;
  }
});
document.getElementById('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') e.target.close(); });

document.getElementById('today').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
load(); render();
</script>
</body>
</html>
